[package]
name = "acoustic-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Wasm shell for the acoustic track: a synth behind raw C-ABI exports, run in an AudioWorklet."

[lib]
# cdylib: a standalone .wasm module with C-ABI exports, separate from the
# engine's (docs/12-acoustic-foundations.md; TASKS A1 decision 1).
crate-type = ["cdylib"]

[dependencies]
acoustic = { path = "../acoustic" }

[lints]
workspace = true
