[package]
name = "sand-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Wasm shell for the falling-sand automaton: a grid behind raw C-ABI exports (docs/11-falling-sand.md)."

[lib]
# cdylib: a standalone .wasm module (sand.wasm), separate from the
# engine's and the synth's (docs/repo-layout.md, "One `.wasm` per track").
crate-type = ["cdylib"]

[dependencies]
sand = { path = "../sand" }
web-common = { path = "../web-common" }

[dev-dependencies]
proptest.workspace = true
test-support = { path = "../test-support" }

[lints]
workspace = true
