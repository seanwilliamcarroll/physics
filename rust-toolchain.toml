# Exact pin (not "stable"): float results, and later golden hashes, must not
# change silently when the toolchain updates. Bump deliberately, in its own PR.
[toolchain]
channel = "1.99.1"
# llvm-tools: llvm-profdata and llvm-cov, matching this rustc's LLVM, which
# cargo-llvm-cov needs to merge and report coverage (cargo xtask coverage).
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
