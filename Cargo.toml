[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

# Third-party crates, one pinned version for the whole workspace; crates
# opt in with `name.workspace = true`. Each needs a justification
# (docs/00-scope.md, dependency policy). Dev-only so far.
[workspace.dependencies]
# Default features include `fork`/`timeout` (each case in a subprocess),
# which WASI doesn't have; the engine tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Benchmarks. Text output only: no plotters (HTML charts) or rayon, and
# their dependency trees; results are recorded in docs/04-testing.md.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# CLI parsing for xtask (dev tooling only; never in the engine or wasm).
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3   # try "s"/"z" later and measure size vs speed
lto = true
codegen-units = 1
panic = "abort"

# Lint policy: see TASKS.md "Lint policy". Every crate opts in with
# `[lints] workspace = true`. Test code is exempted via clippy.toml.
[workspace.lints.rust]
unsafe_code = "deny"            # web's export module opts out locally

[workspace.lints.clippy]
# Default groups (perf, correctness, style, complexity, suspicious) are already on.
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that fight physics notation (x, v, a, m, dt, p0/p1, pos/vel).
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"

# Library safety (restriction group, opt-in).
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"
string_slice = "warn"
