[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
# The physics-engine npm package's version (cargo xtask package), and what
# a release is tagged (docs/16-site-demos.md, "Releases").
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# Third-party crates, one pinned version for the whole workspace; crates
# opt in with `name.workspace = true`. Each needs a justification
# (docs/00-scope.md, dependency policy).
[workspace.dependencies]
# Default features include `fork`/`timeout` (each case in a subprocess),
# which WASI doesn't have; the engine tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Benchmarks. Text output only: no plotters (HTML charts) or rayon, and
# their dependency trees; results are recorded in docs/benchmarks.md.
# Pinned: `cargo xtask bench` compares with records of criterion's saved
# files (docs/bench/), whose format isn't a public API. Before bumping it,
# check a record still compares (docs/benchmarks.md, "Upgrading criterion").
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# CLI parsing for xtask (dev tooling only; never in the engine or wasm).
clap = { version = "4.6.7", features = ["derive"] }
# Transcendental functions (sin, cos, atan, log10, exp10) for the acoustic
# crate's note-on coefficients and, since S2, the swarm crate's noise and
# rotations. std's call each platform's math library
# (Apple's natively, musl's on wasm), which may differ in the last bit; a
# pure-Rust port computes the same bits everywhere, so rendered audio's
# golden hash holds native and on wasm. Maintained by the Rust project
# (rust-lang/compiler-builtins), MIT, no dependencies (A1.3).
libm = "0.2.16"

# Dev and test builds optimize the acoustic crate and the math it leans
# on: the piano's filter design (88 keys, in libm's transcendentals) took
# 1.8 s unoptimized, 0.2 s here, and the synth's property test 70 s,
# 12 s. Debug assertions and overflow checks stay on (opt-level is
# separate from both). Why it's that slow unoptimized: TASKS.md.
[profile.dev.package.acoustic]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
[profile.dev.package.math]
opt-level = 3
# The swarm tests run brute-force flocks (n² pairs a step) for hundreds of
# steps: optimized, they take seconds, not minutes.
[profile.dev.package.swarm]
opt-level = 3

# `cargo xtask slow`: optimized, but keeping debug assertions and overflow
# checks, so 10 000-case property tests and the long `slow_*` runs finish
# in minutes without losing the checks that catch overflow. Tests unwind
# whatever the profile's `panic` (cargo ignores it for tests).
[profile.slow]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
incremental = true

# Profiling (`docs/profiling.md`): release as built, plus the symbols a
# sampling profiler needs to name functions. Its own target dir
# (target/profiling), so release builds aren't disturbed.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
opt-level = 3   # try "s"/"z" later and measure size vs speed
lto = true
codegen-units = 1
panic = "abort"

# Lint policy: see docs/lint-policy.md. Every crate opts in with
# `[lints] workspace = true`. Test code is exempted via clippy.toml.
[workspace.lints.rust]
unsafe_code = "deny"            # the *-web crates' exports and web-common's panic hook opt out locally
unreachable_pub = "warn"        # `pub` only for what the crate exports, so dead_code sees the rest

[workspace.lints.clippy]
# Default groups (perf, correctness, style, complexity, suspicious) are already on.
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that fight physics notation (x, v, a, m, dt, p0/p1, pos/vel).
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"

# Library safety (restriction group, opt-in).
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"
string_slice = "warn"
