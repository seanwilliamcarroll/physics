# CI: the same checks as .githooks/pre-commit and pre-push, on GitHub's
# side, so a PR is checked even if it was pushed with --no-verify or from a
# machine without the hooks (docs/04-testing.md, "CI").
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The exact toolchain, components and targets in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: TypeScript (npm ci)
        run: npm ci

      # The runner for wasm32-wasip1 tests (.cargo/config.toml).
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "50.0.1"

      # --- pre-commit ---
      - name: tsc --noEmit (site TypeScript)
        run: node_modules/.bin/tsc -p tsconfig.json --noEmit
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy web, acoustic-web (wasm32)
        run: cargo clippy -p web -p acoustic-web --target wasm32-unknown-unknown -- -D warnings

      # --- pre-push ---
      - name: cargo test
        run: cargo test --workspace
      - name: cargo doc (links checked)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: node --test (site JS)
        run: node --test 'tests/site/**/*.test.js'
      - name: cargo xtask test-wasm (goldens on wasm)
        run: cargo xtask test-wasm
      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check --workspace --exclude xtask --exclude test-support --target wasm32-unknown-unknown
      # Ubuntu runners ship Chrome as google-chrome, which smoke finds.
      - name: cargo xtask smoke (headless Chrome)
        run: cargo xtask smoke

      - name: Smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots
          path: target/smoke/
